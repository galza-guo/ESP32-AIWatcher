[platformio]
default_envs = s3-eya-rgb
src_dir = src

[env:s3-eya-rgb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DPANEL_EYA_RGB
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2

; Experimental native ESP-IDF RGB driver with internal DMA bounce buffers.
; Keep the original environment available for hardware rollback.
[env:s3-eya-rgb-bounce]
extends = env:s3-eya-rgb
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
build_flags =
  ${env:s3-eya-rgb.build_flags}
  -DDESK_RGB_BOUNCE
lib_deps =
  lovyan03/LovyanGFX@1.2.29
  bblanchon/ArduinoJson@7.4.3

